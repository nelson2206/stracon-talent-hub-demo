<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    // Volver al inicio de sesión equivale a cerrar sesión
    try { localStorage.removeItem('vd-user'); } catch (err) {}
    this.state = { user: '', error: false, showPass: false };
  }
  renderVals() {
    const go = (v) => {
      if (!String(v || '').trim()) { this.setState({ error: true }); return; }
      try { localStorage.setItem('vd-user', String(v).trim()); } catch (err) {}
      window.location.href = 'Dashboard.dc.html';
    };
    return {
      user: this.state.user,
      // vd-user se escribe solo al ingresar (go), no en cada tecla
      onUser: (e) => this.setState({ user: e.target.value, error: false }),
      passType: this.state.showPass ? 'text' : 'password',
      passPressed: this.state.showPass ? 'true' : 'false',
      togglePass: () => this.setState({ showPass: !this.state.showPass }),
      onKey: (e) => {
        if (e.key !== 'Enter') return;
        const u = document.getElementById('usuario');
        go(u ? u.value : this.state.user);
      },
      enter: () => { const u = document.getElementById('usuario'); go(u ? u.value : this.state.user); },
      showError: this.state.error,
      invalid: this.state.error ? 'true' : 'false'
    };
  }
}
</script>
